[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp-server"
version = "0.2.0"
description = "MCP server for Salesforce API integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "asklokesh", email = "asklokesh@example.com" }
]
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27.1,<1.0.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0.0",
    "simple-salesforce>=1.12.6",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5.0"
]

[project.scripts]
salesforce-mcp = "salesforce_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
